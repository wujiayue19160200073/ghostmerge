name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tool shells out to git and creates worktrees; behaviour differs
        # enough between the three platforms that testing only on Linux would
        # miss real breakage (path separators, process trees, temp dirs).
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Environment
        # Failures here have been specific to one runner's git build or temp
        # directory, so record what the job actually ran on.
        run: |
          git --version
          python -VV
          python -c "import sys, tempfile; print('platform', sys.platform); print('tempdir', tempfile.gettempdir())"
      - name: Run tests
        # tools/ci_step.py republishes the failure as an annotation: job logs
        # need an authenticated API call, annotations are public. Keeping that
        # logic in Python rather than in shell keeps this file to one line per
        # step, so it stays reviewable and cannot drift per platform.
        run: python tools/ci_step.py "tests-${{ matrix.os }}-${{ matrix.python }}" python -m unittest discover -s tests -t tests -v
        env:
          PYTHONPATH: src
      - name: Smoke test the demo
        # The demo is the first thing a new user runs; if it breaks, everything
        # else is academic.
        run: python tools/ci_step.py "demo-${{ matrix.os }}-${{ matrix.python }}" python -m ghostmerge demo --yes
        env:
          PYTHONPATH: src
          NO_COLOR: "1"
